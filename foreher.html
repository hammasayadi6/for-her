
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Animation</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #08070d;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
}

#scene {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
        radial-gradient(ellipse at center,
        #390d20 0%,
        #211020 28%,
        #100d18 58%,
        #05050a 100%);
}

#glow {
    position: absolute;
    width: 65vw;
    height: 65vw;
    max-width: 550px;
    max-height: 550px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%);
    background: radial-gradient(circle,
        rgba(255, 0, 65, .25),
        rgba(180, 0, 50, .12) 45%,
        transparent 72%);
    animation: pulse 3s infinite alternate;
}

@keyframes pulse {
    from { opacity: .5; transform: translate(-50%,-50%) scale(.85); }
    to { opacity: 1; transform: translate(-50%,-50%) scale(1.2); }
}

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
}

#name {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    color: white;
    font-size: clamp(28px, 7vw, 48px);
    z-index: 5;
    text-shadow:
        0 0 5px white,
        0 0 15px #ff315e,
        0 0 30px #ff174f;
    pointer-events: none;
    white-space: nowrap;
    animation: nameGlow 2s infinite alternate;
}

@keyframes nameGlow {
    from { text-shadow: 0 0 8px #ff315e; }
    to { text-shadow: 0 0 25px #ff174f, 0 0 40px #ff174f; }
}
</style>
</head>

<body>

<div id="scene">
    <div id="glow"></div>
    <canvas id="canvas"></canvas>
    <div id="name">ssnory</div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, DPR;
let particles = [];

const WORDS = [
    "I love you",
    "I love you",
    "I love you",
    "Love you",
    "I love you",
    "Forever",
    "I love you"
];

// EDIT YOUR NAME HERE
const CENTER_NAME = "jennifer";

document.getElementById("name").textContent = CENTER_NAME;

// Create a 3D spherical arrangement
function createParticles() {
    particles = [];

    const count = 850;
    const goldenAngle = Math.PI * (3 - Math.sqrt(5));

    for (let i = 0; i < count; i++) {

        const y = 1 - (i / (count - 1)) * 2;
        const radius = Math.sqrt(1 - y * y);
        const theta = goldenAngle * i;

        const x = Math.cos(theta) * radius;
        const z = Math.sin(theta) * radius;

        particles.push({
            x: x,
            y: y,
            z: z,
            word: WORDS[Math.floor(Math.random() * WORDS.length)],
            size: 7 + Math.random() * 4,
            phase: Math.random() * Math.PI * 2
        });
    }
}

function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    createParticles();
}

window.addEventListener("resize", resize);

// Rotate 3D coordinates
function rotateY(p, angle) {
    return {
        x: p.x * Math.cos(angle) - p.z * Math.sin(angle),
        y: p.y,
        z: p.x * Math.sin(angle) + p.z * Math.cos(angle)
    };
}

function rotateX(p, angle) {
    return {
        x: p.x,
        y: p.y * Math.cos(angle) - p.z * Math.sin(angle),
        z: p.y * Math.sin(angle) + p.z * Math.cos(angle)
    };
}

function animate(time) {

    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;

    const scale = Math.min(W, H) * 0.31;

    const rotation = time * 0.00025;
    const rotationX = Math.sin(time * 0.0003) * 0.16;

    let projected = [];

    for (const p of particles) {

        let point = rotateY(p, rotation);
        point = rotateX(point, rotationX);

        // Perspective
        const perspective = 3.2 / (3.2 - point.z * 0.65);

        const x = cx + point.x * scale * perspective;
        const y = cy + point.y * scale * perspective;

        projected.push({
            x: x,
            y: y,
            z: point.z,
            size: p.size * perspective,
            word: p.word,
            phase: p.phase
        });
    }

    // Draw distant particles first
    projected.sort((a, b) => a.z - b.z);

    for (const p of projected) {

        const depth = (p.z + 1) / 2;

        const opacity = 0.35 + depth * 0.65;

        const flicker =
            0.85 + Math.sin(time * 0.003 + p.phase) * 0.15;

        ctx.save();

        ctx.globalAlpha = opacity * flicker;

        ctx.font = `bold ${p.size}px Arial`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.shadowBlur = 8;
        ctx.shadowColor = "#ff174f";

        if (depth > 0.65) {
            ctx.fillStyle = "#ffffff";
        } else if (depth > 0.3) {
            ctx.fillStyle = "#ffb2c7";
        } else {
            ctx.fillStyle = "#e95b83";
        }

        ctx.fillText(p.word, p.x, p.y);

        ctx.restore();
    }

    requestAnimationFrame(animate);
}

resize();
requestAnimationFrame(animate);

</script>

</div>
</body>
</html>
